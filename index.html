<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Pārbaudītājs — V4.6.2</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f3f5f7;--card:#fff;--text:#18202a;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--green:#176b38;--greenbg:#eaf8ef;--amber:#8a5a00;--amberbg:#fff5d8;--red:#a12626;--redbg:#fff0f0;--blue:#245b9e;--bluebg:#edf5ff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);margin:0;padding:18px;color:var(--text)}
.wrap{max-width:900px;margin:auto}.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 8px 30px #00000010;margin-bottom:14px}
h1{margin:0 0 6px;font-size:30px}h2{margin:0 0 12px;font-size:21px}h3{margin:0 0 7px;font-size:17px}.sub,.muted{color:var(--muted)}
.badge,.pill{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:750}.badge{background:#e8f7ee;color:#18723b;margin-bottom:14px}
.urlrow{display:grid;grid-template-columns:1fr auto;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,button{font:inherit;border-radius:12px;padding:14px}input{border:1px solid #d5dae0;width:100%;background:#fff}button{border:0;background:var(--dark);color:#fff;font-weight:750;cursor:pointer}
button.secondary{background:#eef1f4;color:#1f2937}.full{width:100%;margin-top:12px}.hidden{display:none}
.status{margin-top:12px;padding:12px;border-radius:12px;background:#f5f7f9;color:#4b5563}.status.ok{background:var(--greenbg);color:var(--green)}.status.err{background:var(--redbg);color:var(--red)}.status.work{background:var(--bluebg);color:var(--blue)}
.data{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.metric{background:#f7f8fa;border-radius:14px;padding:13px;min-height:78px}.metric small{display:block;color:var(--muted);margin-bottom:5px}.metric b{font-size:17px;overflow-wrap:anywhere}
section{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.issue{border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;background:#fcfcfd}.issueTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.sev-high{background:#fde9e7;color:#8e1b1b}.sev-med{background:#fff5d8;color:#7c5400}.sev-low{background:#eef4ff;color:#245b9e}
.source{padding:10px 0;border-bottom:1px solid #eee}.source:last-child{border-bottom:0}.source a{color:#174ea6;text-decoration:none;font-weight:650}.source small{display:block;color:var(--muted);margin-top:3px}
.summary{background:#f7f8fa;border-radius:14px;padding:14px;line-height:1.5}
.note{font-size:13px;color:var(--muted);line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sheet{display:grid;gap:8px}.sheetRow{display:grid;grid-template-columns:24px minmax(120px,.7fr) 1.5fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff}
.box{width:18px;height:18px;border:2px solid #9aa3ad;border-radius:4px;margin-top:1px;background:#fff}.sheetTitle{font-weight:750}.sheetText{color:#4b5563;line-height:1.4}
.sectionHint{font-size:13px;color:var(--muted);margin:-4px 0 10px}.compactBtn{width:auto;padding:9px 12px;margin-top:10px}
@media(max-width:650px){.urlrow,.grid,.actions{grid-template-columns:1fr}.data{grid-template-columns:1fr 1fr}h1{font-size:26px}.issueTop{display:block}.sheetRow{grid-template-columns:22px 1fr}.sheetText{grid-column:2}}
@media print{body{background:#fff;padding:0}.card{box-shadow:none}.no-print{display:none}.sheetRow{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="badge">V4.6.2 • AUTO PĀRBAUDE</span>
    <h1>🚗 Auto Pārbaudītājs</h1>
    <p class="sub">Ielīmē SS.COM sludinājuma saiti. Auto dati un pārbaudes punkti tiek pielāgoti konkrētajam modelim, dzinējam, kārbai un nobraukumam.</p>
    <div class="urlrow">
      <input id="listingUrl" type="url" placeholder="https://www.ss.com/msg/lv/transport/cars/...">
      <button onclick="searchListing()">🔎 MEKLĒT AUTO</button>
    </div>
    <div id="status" class="status">Gatavs. Ielīmē SS.COM saiti.</div>
  </div>

  <div class="card">
    <h2>Auto dati</h2>
    <div class="grid">
      <input id="make" placeholder="Marka (BMW)">
      <input id="model" placeholder="Modelis (320d)">
      <input id="year" placeholder="Gads (2015)" type="number">
      <input id="engine" placeholder="Dzinējs / degviela">
      <input id="power" placeholder="Jauda (kW)">
      <input id="gearbox" placeholder="Ātrumkārba">
      <input id="mileage" placeholder="Nobraukums (km)">
      <input id="price" placeholder="Cena (€)">
    </div>
    <button class="full" onclick="analyze()">ANALIZĒT AUTO</button>
  </div>

  <div id="result" class="card hidden"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const val=id=>$(id).value.trim();
const vehicle=()=>({make:val("make"),model:val("model"),year:val("year"),engine:val("engine"),power:val("power"),gearbox:val("gearbox"),mileage:val("mileage"),price:val("price"),listingUrl:val("listingUrl")});
const withUnit=(x,u)=>!x?"—":String(x).toLowerCase().includes(u.toLowerCase())?x:`${x} ${u}`;

function fill(d){
  ["make","model","year","engine","power","gearbox","mileage","price"].forEach(k=>{
    if(d[k]!==undefined&&d[k]!==null&&String(d[k]).trim()!=="")$(k).value=d[k]
  })
}
function setStatus(text,kind=""){$("status").className="status"+(kind?` ${kind}`:"");$("status").textContent=text}

async function searchListing(){
  const url=val("listingUrl");
  if(!url){setStatus("Ielīmē SS.COM sludinājuma saiti.","err");return}
  if(!/^https?:\/\/([a-z0-9-]+\.)?ss\.(com|lv)\//i.test(url)){setStatus("Saitei jābūt no SS.COM vai SS.LV.","err");return}
  setStatus("Nolasu sludinājuma datus…","work");
  try{
    const r=await fetch("/api/listing",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Neizdevās nolasīt sludinājumu");
    fill(d);
    setStatus("✓ Sludinājuma dati atrasti. Gatavoju pārbaudes plānu…","ok");
    await analyze();
  }catch(e){setStatus("Neizdevās importēt: "+e.message,"err")}
}

function baseHtml(v){
  return `<h2>📋 ${esc(v.make||"Auto")} ${esc(v.model||"")}</h2>
  <div class="data">
    <div class="metric"><small>Gads</small><b>${esc(v.year||"—")}</b></div>
    <div class="metric"><small>Dzinējs</small><b>${esc(v.engine||"—")}</b></div>
    <div class="metric"><small>⚡ Jauda</small><b>${esc(withUnit(v.power,"kW"))}</b></div>
    <div class="metric"><small>⚙️ Ātrumkārba</small><b>${esc(v.gearbox||"—")}</b></div>
    <div class="metric"><small>Nobraukums</small><b>${esc(withUnit(v.mileage,"km"))}</b></div>
    <div class="metric"><small>Cena</small><b>${v.price?`€${esc(v.price)}`:"—"}</b></div>
  </div>
  <section><h2>Auto pārbaudes plāns</h2><div id="intelStatus" class="status work">Apkopoju šim auto svarīgākos pārbaudes punktus…</div><div id="intel"></div></section>`;
}

async function analyze(){
  const v=vehicle();
  if(!v.make&&!v.model&&!v.engine){setStatus("Vispirms importē SS.COM sludinājumu vai ievadi auto datus.","err");return}
  $("result").classList.remove("hidden");
  $("result").innerHTML=baseHtml(v);
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
  try{
    const r=await fetch("/api/intelligence",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Intelligence unavailable");
    renderIntel(d,v);
  }catch(e){
    $("intelStatus").className="status";
    $("intelStatus").textContent="Pārbaudes plāns sagatavots no auto datiem.";
    renderFallback(v);
  }
}

function issueHtml(i){
  const sev=i.severity==="high"?"Svarīgi":i.severity==="low"?"Papildus":"Pārbaudīt";
  return `<div class="issue">
    <div class="issueTop"><div><h3>${esc(i.title)}</h3><div class="muted">${esc(i.reason||"")}</div></div></div>
    <div class="tags"><span class="pill sev-${esc(i.severity||"med")}">${sev}</span>${i.sourceCount?`<span class="pill">${i.sourceCount} avoti</span>`:""}</div>
    ${i.check?`<div><b>Pārbaude:</b> ${esc(i.check)}</div>`:""}
    ${i.symptoms?`<div style="margin-top:6px"><b>Pazīmes:</b> ${esc(i.symptoms)}</div>`:""}
  </div>`;
}

function sourceHtml(s){
  return `<div class="source"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.domain||"Avots")}</a><small>${esc(s.domain||"")}${s.type?` • ${esc(s.type)}`:""}</small></div>`;
}

function sheetRow(title,text,extraClass=""){
  return `<div class="sheetRow ${extraClass}"><span class="box"></span><div class="sheetTitle">${esc(title)}</div><div class="sheetText">${esc(text)}</div></div>`;
}

function sellerRow(text){
  const parts=String(text||"").split(/\s+—\s+/);
  const title=parts.shift()||"Pārdevējam";
  const detail=parts.join(" — ")||"Noskaidrot pirms apskates.";
  return sheetRow(title,detail);
}

function renderIntel(d,v){
  const st=$("intelStatus");
  if(d.researchStatus==="live" && d.sources?.length){
    st.className="status ok";
    st.textContent=`✓ Pārbaudes plāns gatavs. Papildus pārbaudīti ${d.sources.length} ārējie avoti.`;
  }else{
    st.className="status ok";
    st.textContent="✓ Pārbaudes plāns gatavs.";
  }

  let html="";
  if(d.fingerprint) html+=`<div class="summary"><b>Auto:</b> ${esc(d.fingerprint)}</div>`;

  html+=`<section><h2>⚠️ Tipiskie riski šim auto</h2>${(d.issues||[]).map(issueHtml).join("")||"<p class='muted'>Papildu modelim raksturīgi riski nav identificēti.</p>"}</section>`;

  if(d.mileageChecks?.length){
    html+=`<section><h2>🛣️ Pie šī nobraukuma</h2><div class="sheet">${d.mileageChecks.map((x,i)=>sheetRow(`Punkts ${i+1}`,x)).join("")}</div></section>`;
  }

  if(d.sellerQuestions?.length){
    html+=`<section><h2>💬 Ko noskaidrot pie pārdevēja</h2>
      <p class="sectionHint">Īsi punkti, ko izrunāt pirms braukt skatīties auto.</p>
      <div id="sellerQ" class="sheet">${d.sellerQuestions.map(sellerRow).join("")}</div>
      <button class="secondary compactBtn no-print" onclick="copyQuestions()">📋 KOPĒT</button>
    </section>`;
  }

  if(d.sources?.length){
    html+=`<section><h2>🔗 Avoti</h2><p class="note">Forumu ieraksti ir īpašnieku pieredze. Tos izmanto kā papildu pārbaudes virzienus, nevis kā pierādījumu, ka konkrētajam auto ir defekts.</p>${d.sources.map(sourceHtml).join("")}</section>`;
  }

  html+=`<section><h2>🔧 Pirms pirkuma</h2>
    <p class="sectionHint">Atzīmē apskates laikā.</p>
    <div class="sheet">
      ${sheetRow("Dokumenti","Servisa vēsture, rēķini un nobraukuma secība.")}
      ${sheetRow("Auksts starts","Motoru pārbaudīt pilnīgi aukstu; klausīties trokšņus un vērot dūmus.")}
      ${sheetRow("Diagnostika","OBD kļūdas, kļūdu vēsture un readiness statusi.")}
      ${sheetRow("Testa brauciens","Kārba, bremzes, stūre, vibrācijas, trokšņi un jaudas padeve.")}
      ${sheetRow("Apakša / virsbūve","Noplūdes, korozija, riepas, piekare un remonta pazīmes.")}
      ${sheetRow("Servisa pārbaude","Ja rodas šaubas — neatkarīga pirmspirkuma pārbaude.")}
    </div>
  </section>`;

  html+=`<div class="actions no-print"><button onclick="window.print()">📄 SAGLABĀT PDF</button><button class="secondary" onclick="analyze()">↻ ATJAUNOT</button></div>`;
  $("intel").innerHTML=html;
}

function renderFallback(v){
  $("intel").innerHTML=`<section><h2>🔎 Pamata pārbaude</h2>
    <div class="sheet">
      ${sheetRow("Dzinējs","Auksts starts, noplūdes, trokšņi un kļūdas.")}
      ${sheetRow("Ātrumkārba","Darbība aukstā un siltā režīmā, apkopes vēsture.")}
      ${sheetRow("Piekare / bremzes","Klaboņa, vibrācijas, riepas un bremzēšana.")}
      ${sheetRow("Vēsture","Servisa ieraksti, rēķini un nobraukuma secība.")}
    </div>
  </section>`;
}

async function copyQuestions(){
  const q=[...document.querySelectorAll("#sellerQ .sheetRow")].map(x=>{
    const title=x.querySelector(".sheetTitle")?.innerText||"";
    const text=x.querySelector(".sheetText")?.innerText||"";
    return `${title} — ${text}`.trim();
  }).join("\n");
  try{await navigator.clipboard.writeText(q);alert("Punkti nokopēti!")}catch{alert(q)}
}
</script>
</body>
</html>
